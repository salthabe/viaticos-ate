<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viáticos ATE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --navy: #1a3a5c;
  --blue: #2d6a9f;
  --sky: #4a9fd4;
  --ice: #EBF3FB;
  --ice2: #d6e9f8;
  --white: #ffffff;
  --gray50: #f8fafc;
  --gray100: #f1f5f9;
  --gray200: #e2e8f0;
  --gray300: #cbd5e1;
  --gray500: #64748b;
  --gray700: #334155;
  --gray900: #0f172a;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --yellow: #d97706;
  --yellow-bg: #fef3c7;
  --orange: #ea580c;
  --orange-bg: #ffedd5;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow: 0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.14);
  --radius: 12px;
  --radius-sm: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--gray50);
  color: var(--gray900);
  min-height: 100vh;
  font-size: 14px;
}

.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 100;
}

.sidebar-logo { padding: 24px 20px 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
.sidebar-logo .org { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--sky); margin-bottom: 4px; }
.sidebar-logo .app-name { font-size: 18px; font-weight: 700; color: var(--white); line-height: 1.2; }
.sidebar-logo .app-sub { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 3px; }

.sidebar-nav { padding: 16px 12px; flex: 1; }
.nav-section { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.35); padding: 12px 8px 6px; margin-top: 8px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); color: rgba(255,255,255,.7); cursor: pointer; transition: all .15s; font-size: 13.5px; font-weight: 500; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: rgba(255,255,255,.08); color: var(--white); }
.nav-item.active { background: rgba(74,159,212,.2); color: var(--sky); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

.sidebar-footer { padding: 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; color: rgba(255,255,255,.3); text-align: center; }

.main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; }

.topbar { background: var(--white); border-bottom: 1px solid var(--gray200); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar-title { font-size: 16px; font-weight: 600; color: var(--gray900); }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.content { padding: 28px 32px; flex: 1; }

.period-bar { background: var(--white); border: 1px solid var(--gray200); border-radius: var(--radius); padding: 14px 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
.period-label { font-size: 12px; font-weight: 600; color: var(--gray500); text-transform: uppercase; letter-spacing: .06em; }
.period-select { padding: 7px 12px; border: 1.5px solid var(--gray200); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--gray900); background: var(--gray50); cursor: pointer; outline: none; transition: border-color .15s; }
.period-select:focus { border-color: var(--sky); }

/* ── CARD DE PRESUPUESTO ── */
.presup-card {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  color: white;
  border-radius: var(--radius);
  padding: 18px 22px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.presup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
.presup-titulo { font-size: 13px; font-weight: 600; opacity: 0.9; letter-spacing: .05em; text-transform: uppercase; }
.presup-periodo { font-size: 13px; opacity: 0.8; margin-top: 2px; }
.presup-input-wrap { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.18); padding: 6px 12px; border-radius: 8px; }
.presup-input-wrap span { opacity: 0.7; font-size: 14px; }
.presup-input-wrap input { background: transparent; border: none; color: white; font-size: 15px; font-weight: 600; width: 140px; outline: none; text-align: right; font-family: 'DM Mono', monospace; }
.presup-input-wrap input::placeholder { color: rgba(255,255,255,0.5); font-weight: 400; }
.presup-btn { background: rgba(255,255,255,0.25); color: white; border: none; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; transition: background .15s; }
.presup-btn:hover { background: rgba(255,255,255,0.4); }
.presup-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
.presup-num { background: rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 12px; text-align: center; }
.presup-num-label { font-size: 11px; opacity: 0.8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.presup-num-valor { font-size: 17px; font-weight: 700; font-family: 'DM Mono', monospace; }
.presup-num-valor.aprobado { color: #ffd166; }
.presup-num-valor.pagado { color: #06d6a0; }
.presup-num-valor.saldo-ok { color: white; }
.presup-num-valor.saldo-bajo { color: #ffd166; }
.presup-num-valor.saldo-rojo { color: #ff8585; }
.presup-barras { display: flex; flex-direction: column; gap: 8px; }
.presup-barra-row { display: flex; align-items: center; gap: 10px; }
.presup-barra-label { font-size: 12px; opacity: 0.85; min-width: 70px; font-weight: 500; }
.presup-barra-track { flex: 1; background: rgba(255,255,255,0.15); height: 12px; border-radius: 6px; overflow: hidden; }
.presup-barra-fill { height: 100%; border-radius: 6px; transition: width .4s ease; }
.presup-barra-fill.aprobado { background: #ffd166; }
.presup-barra-fill.pagado { background: #06d6a0; }
.presup-barra-pct { font-size: 12px; font-weight: 600; min-width: 50px; text-align: right; font-family: 'DM Mono', monospace; }
.presup-alerta { margin-top: 12px; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.presup-alerta.warn { background: rgba(255,209,102,0.2); border: 1px solid rgba(255,209,102,0.5); color: #fff3c4; }
.presup-alerta.danger { background: rgba(255,107,107,0.25); border: 1px solid rgba(255,107,107,0.6); color: #ffe1e1; }
.presup-sin-config { text-align: center; padding: 8px 0; font-size: 13px; opacity: 0.85; }
.presup-sin-periodo { background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.4); padding: 10px 14px; border-radius: 8px; font-size: 13px; text-align: center; }
@media (max-width: 700px) {
  .presup-nums { grid-template-columns: repeat(2, 1fr); }
}

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--white); border-radius: var(--radius); padding: 20px; border: 1px solid var(--gray200); box-shadow: var(--shadow-sm); }
.stat-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--gray500); margin-bottom: 8px; }
.stat-card .value { font-size: 26px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.stat-card .sub { font-size: 12px; color: var(--gray500); margin-top: 4px; }
.stat-card.green .value { color: var(--green); }
.stat-card.red .value { color: var(--red); }
.stat-card.yellow .value { color: var(--yellow); }

.card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray200); box-shadow: var(--shadow-sm); overflow: hidden; }
.card-header { padding: 16px 20px; border-bottom: 1px solid var(--gray100); display: flex; align-items: center; justify-content: space-between; }
.card-title { font-size: 14px; font-weight: 600; color: var(--gray900); }
.card-body { padding: 0; }

table { width: 100%; border-collapse: collapse; }
thead th { background: var(--gray50); padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--gray500); border-bottom: 1px solid var(--gray200); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--gray100); transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: var(--gray50); }
tbody td { padding: 11px 16px; font-size: 13.5px; color: var(--gray700); vertical-align: middle; }
.td-amount { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
.td-name { font-weight: 600; color: var(--gray900); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11.5px; font-weight: 600; }
.badge-pendiente { background: var(--yellow-bg); color: var(--yellow); }
.badge-aprobado { background: var(--green-bg); color: var(--green); }
.badge-rechazado { background: var(--red-bg); color: var(--red); }
.badge-debito { background: var(--orange-bg); color: var(--orange); }
.badge-pagado { background: #e0f2fe; color: #0369a1; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; text-decoration: none; }
.btn-primary { background: var(--blue); color: var(--white); }
.btn-primary:hover { background: var(--navy); }
.btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn-outline:hover { background: var(--ice); }
.btn-ghost { background: transparent; color: var(--gray700); border: 1.5px solid var(--gray200); }
.btn-ghost:hover { background: var(--gray100); }
.btn-danger { background: var(--red); color: white; }
.btn-danger:hover { opacity: .85; }
.btn-green { background: var(--green); color: white; }
.btn-green:hover { opacity: .85; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px 8px; }

.form-grid { display: grid; gap: 16px; }
.form-grid-2 { grid-template-columns: 1fr 1fr; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--gray700); }
.input, .select, textarea { padding: 9px 12px; border: 1.5px solid var(--gray200); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--gray900); background: var(--white); outline: none; transition: border-color .15s; width: 100%; }
.input:focus, .select:focus, textarea:focus { border-color: var(--sky); }
.input-money { font-family: 'DM Mono', monospace; }

.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(3px); z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn .15s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal { background: var(--white); border-radius: 16px; width: 560px; max-width: 94vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp .2s; }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--gray100); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray500); padding: 0 4px; line-height: 1; }
.modal-close:hover { color: var(--gray900); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--gray100); display: flex; gap: 8px; justify-content: flex-end; }

.tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.tab { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--gray500); transition: all .15s; border: none; background: none; }
.tab:hover { color: var(--gray900); background: var(--gray100); }
.tab.active { background: var(--navy); color: var(--white); }

#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--gray900); color: white; padding: 12px 18px; border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); animation: slideUp .2s; display: flex; align-items: center; gap: 8px; min-width: 260px; }
.toast.success { background: #15803d; }
.toast.error { background: var(--red); }
.toast.warning { background: var(--yellow); color: var(--gray900); }

.empty-state { text-align: center; padding: 56px 32px; color: var(--gray500); }
.empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; font-weight: 500; }
.empty-state small { font-size: 13px; color: var(--gray300); }

.agente-row-total { background: linear-gradient(90deg, var(--navy) 0%, var(--blue) 100%); color: white; }
.agente-row-total td { color: white !important; font-weight: 700; }

.tope-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--ice2); color: var(--navy); }
.progress-bar-wrap { width: 80px; height: 6px; background: var(--gray200); border-radius: 3px; display: inline-block; vertical-align: middle; margin-left: 6px; }
.progress-bar-fill { height: 100%; border-radius: 3px; background: var(--sky); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filter-chip { padding: 5px 12px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--gray200); background: var(--white); color: var(--gray500); transition: all .15s; }
.filter-chip:hover { border-color: var(--sky); color: var(--sky); }
.filter-chip.active { background: var(--navy); color: white; border-color: var(--navy); }

.search-input { padding: 6px 12px; border: 1.5px solid var(--gray200); border-radius: 20px; font-size: 13px; outline: none; width: 200px; transition: border-color .15s; }
.search-input:focus { border-color: var(--sky); }

.tope-inline { display: flex; align-items: center; gap: 6px; }
.tope-value { cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: background .15s; }
.tope-value:hover { background: var(--ice); }

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-grid-3 { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="org">Sindicato ATE</div>
      <div class="app-name">Viáticos</div>
      <div class="app-sub">Sistema de Reintegros</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" onclick="navigate('dashboard')"><span class="icon">📊</span> Panel de Control</button>
      <button class="nav-item" onclick="navigate('tickets')"><span class="icon">🧾</span> Tickets</button>
      <div class="nav-section">Gestión</div>
      <button class="nav-item" onclick="navigate('agentes')"><span class="icon">👥</span> Agentes</button>
      <button class="nav-item" onclick="navigate('topes')"><span class="icon">🎯</span> Topes Mensuales</button>
      <button class="nav-item" onclick="navigate('periodos_pago')"><span class="icon">🗂️</span> Períodos de Pago</button>
      <div class="nav-section">Registros</div>
      <button class="nav-item" onclick="navigate('actas')"><span class="icon">📋</span> Libro de Actas</button>
      <div class="nav-section">Reportes</div>
      <button class="nav-item" onclick="navigate('reportes')"><span class="icon">📈</span> Reportes</button>
      <button class="nav-item" onclick="navigate('exportar')"><span class="icon">📥</span> Exportar</button>
    </nav>
    <div class="sidebar-footer">ATE Viáticos v1.0</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">Panel de Control</span>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modal-container"></div>
<div id="toast-container"></div>

<script>
// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const state = {
  page: 'dashboard',
  anio: new Date().getFullYear(),
  mes: new Date().getMonth() + 1,
  agentes: [],
  categorias: [],
  tickets: [],
  resumen: [],
  ticketFilter: 'todos',
  ticketSearch: '',
  ticketMeses: [],
  ticketVista: 'mes',
  dashVista: 'mes',
  filtroPeriodoPago: null,
  filtroPeriodoPagoNombre: null,
  filtroPeriodoManual: false,
  periodoActivo: null,
  presupuestoPeriodoSeleccionado: null  // id del período mostrado en el card (puede no ser el activo)
};

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ══════════════════════════════════════════════════════════
//  API
// ══════════════════════════════════════════════════════════
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.detail || 'Error en la solicitud');
  }
  return res.json();
}

async function loadAll() {
  [state.agentes, state.categorias] = await Promise.all([
    api('GET', '/agentes'),
    api('GET', '/categorias')
  ]);
}

async function loadResumen() {
  if (state.dashVista === 'mes') {
    state.resumen = await api('GET', `/resumen?anio=${state.anio}&mes=${state.mes}`);
  } else if (state.dashVista === 'anio') {
    state.resumen = await api('GET', `/resumen/agrupado?anio=${state.anio}`);
  } else {
    state.resumen = await api('GET', '/resumen/agrupado');
  }
}

async function loadTickets() {
  if (state.filtroPeriodoPago) {
    state.tickets = await api('GET', `/tickets?periodo_pago_id=${state.filtroPeriodoPago}`);
    state.ticketMeses = [];
  } else if (state.ticketVista === 'todo') {
    state.tickets = await api('GET', '/tickets');
    state.ticketMeses = [];
  } else if (state.ticketVista === 'anio') {
    state.tickets = await api('GET', `/tickets?anio=${state.anio}`);
    state.ticketMeses = [];
  } else if (state.ticketMeses.length > 0) {
    const all = await api('GET', `/tickets?anio=${state.anio}`);
    state.tickets = all.filter(t => {
      const m = parseInt((t.fecha_gasto || '').slice(5, 7));
      return state.ticketMeses.includes(m);
    });
  } else {
    state.tickets = await api('GET', `/tickets?anio=${state.anio}&mes=${state.mes}`);
  }
}

// ══════════════════════════════════════════════════════════
//  PRESUPUESTO — render del card
// ══════════════════════════════════════════════════════════
async function renderPresupuestoCard() {
  const cont = document.getElementById('presup-card-container');
  if (!cont) return;

  // Determinar qué período mostrar
  let ppId = state.presupuestoPeriodoSeleccionado || state.filtroPeriodoPago;

  // Si no hay seleccionado, usar el activo
  if (!ppId) {
    try {
      const activo = await api('GET', '/periodos_pago/activo');
      if (activo) {
        state.periodoActivo = activo;
        ppId = activo.id;
      }
    } catch(e) {}
  }

  if (!ppId) {
    cont.innerHTML = `
      <div class="presup-card">
        <div class="presup-sin-periodo">
          ⚠ No hay período de pago activo. Creá uno desde la sección "Períodos de Pago" para usar el presupuesto.
        </div>
      </div>`;
    return;
  }

  // Traer datos del presupuesto + nombre del período
  let data, pp;
  try {
    [data, pp] = await Promise.all([
      api('GET', `/presupuesto/${ppId}`),
      obtenerPeriodoPago(ppId)
    ]);
  } catch(e) {
    cont.innerHTML = '';
    return;
  }

  const periodoLabel = pp ? `${String(pp.numero).padStart(3,'0')} — ${pp.nombre}` : `Período #${ppId}`;
  const cerrado = pp && pp.estado === 'cerrado';

  let claseSaldo = 'saldo-ok';
  if (data.monto > 0) {
    const pctSaldo = data.saldo / data.monto;
    if (pctSaldo < 0) claseSaldo = 'saldo-rojo';
    else if (pctSaldo < 0.10) claseSaldo = 'saldo-rojo';
    else if (pctSaldo < 0.20) claseSaldo = 'saldo-bajo';
  }

  cont.innerHTML = `
    <div class="presup-card">
      <div class="presup-header">
        <div>
          <div class="presup-titulo">💰 Presupuesto del Período</div>
          <div class="presup-periodo">${periodoLabel} ${cerrado ? '🔒' : ''}</div>
        </div>
        ${!cerrado ? `
          <div class="presup-input-wrap">
            <span>$</span>
            <input type="number" id="inputPresupuesto" value="${data.monto || ''}"
                   placeholder="0.00" step="0.01" min="0"
                   onkeydown="if(event.key==='Enter') guardarPresupuesto()">
            <button class="presup-btn" onclick="guardarPresupuesto()">💾 Guardar</button>
          </div>
        ` : `
          <div style="font-size:12px;opacity:0.8;padding:6px 12px;background:rgba(255,255,255,0.1);border-radius:6px">
            Período cerrado — solo lectura

        `}
      </div>

      ${data.monto > 0 ? `
        <div class="presup-nums">
          <div class="presup-num">
            <div class="presup-num-label">Presupuesto</div>
            <div class="presup-num-valor">${fmt(data.monto)}</div>
          </div>
          <div class="presup-num">
            <div class="presup-num-label">✅ Aprobado</div>
            <div class="presup-num-valor aprobado">${fmt(data.aprobado)}</div>
          </div>
          <div class="presup-num">
            <div class="presup-num-label">💸 Pagado</div>
            <div class="presup-num-valor pagado">${fmt(data.pagado)}</div>
          </div>
          <div class="presup-num">
            <div class="presup-num-label">Saldo disponible</div>
            <div class="presup-num-valor ${claseSaldo}">${fmt(data.saldo)}</div>
          </div>
        </div>

        <div class="presup-barras">
          <div class="presup-barra-row">
            <div class="presup-barra-label">✅ Aprobado</div>
            <div class="presup-barra-track">
              <div class="presup-barra-fill aprobado" style="width:${Math.min(data.porcentaje_aprobado, 100)}%"></div>
            </div>
            <div class="presup-barra-pct">${data.porcentaje_aprobado.toFixed(1)}%</div>
          </div>
          <div class="presup-barra-row">
            <div class="presup-barra-label">💸 Pagado</div>
            <div class="presup-barra-track">
              <div class="presup-barra-fill pagado" style="width:${Math.min(data.porcentaje_pagado, 100)}%"></div>
            </div>
            <div class="presup-barra-pct">${data.porcentaje_pagado.toFixed(1)}%</div>
          </div>
        </div>

        ${data.excedido ? `
          <div class="presup-alerta danger">
            🚨 <strong>Presupuesto excedido</strong> en ${fmt(data.comprometido - data.monto)} (${((data.comprometido/data.monto - 1)*100).toFixed(1)}% sobre el límite)
          </div>
        ` : data.alerta_bajo_saldo ? `
          <div class="presup-alerta warn">
            ⚠ <strong>Atención:</strong> queda menos del 20% del presupuesto (${((data.saldo/data.monto)*100).toFixed(1)}% disponible)
          </div>
        ` : ''}
      ` : `
        <div class="presup-sin-config">
          ${cerrado ? 'No se configuró presupuesto para este período.' : '👆 Ingresá el monto del presupuesto en el campo de arriba para empezar el seguimiento'}
        </div>
      `}
    </div>
  `;
}

async function obtenerPeriodoPago(id) {
  try {
    const periodos = await api('GET', '/periodos_pago');
    return periodos.find(p => p.id == id);
  } catch(e) { return null; }
}

async function guardarPresupuesto() {
  const input = document.getElementById('inputPresupuesto');
  if (!input) return;
  const monto = parseFloat(input.value);
  if (isNaN(monto) || monto < 0) {
    toast('Ingresá un monto válido', 'error');
    return;
  }
  const ppId = state.presupuestoPeriodoSeleccionado || state.filtroPeriodoPago || (state.periodoActivo && state.periodoActivo.id);
  if (!ppId) {
    toast('No hay período activo', 'error');
    return;
  }
  try {
    await api('POST', '/presupuesto', { periodo_pago_id: ppId, monto: monto });
    toast('Presupuesto guardado 💰', 'success');
    await renderPresupuestoCard();
  } catch(e) {
    toast('Error al guardar: ' + e.message, 'error');
  }
}

// ══════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : '⚠';
  el.innerHTML = `<span>${icon}</span> ${msg}`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ══════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════
async function navigate(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navMap = { dashboard: 0, tickets: 1, agentes: 3, topes: 4, periodos_pago: 5, actas: 6, reportes: 7, exportar: 8 };
  document.querySelectorAll('.nav-item')[navMap[page]]?.classList.add('active');

  const titles = {
    dashboard: 'Panel de Control', tickets: 'Tickets de Viáticos',
    agentes: 'Gestión de Agentes', topes: 'Topes Mensuales',
    periodos_pago: 'Períodos de Pago', actas: 'Libro de Actas',
    reportes: 'Reportes y Estadísticas', exportar: 'Exportar Reportes'
  };

  document.getElementById('topbar-title').textContent = titles[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = '<div style="padding:40px;text-align:center;color:#64748b">Cargando...</div>';

  await loadAll();

  if (page === 'dashboard') await renderDashboard();
  else if (page === 'tickets') await renderTickets();
  else if (page === 'agentes') renderAgentes();
  else if (page === 'topes') await renderTopes();
  else if (page === 'periodos_pago') await renderPeriodosPago();
  else if (page === 'actas') await renderActas();
  else if (page === 'reportes') await renderReportes();
  else if (page === 'exportar') renderExportar();
}

// ══════════════════════════════════════════════════════════
//  PERIOD BAR
// ══════════════════════════════════════════════════════════
function periodBar() {
  const years = [2023, 2024, 2025, 2026];
  setTimeout(async () => {
    const el = document.getElementById('cierre-badge');
    if (el) el.innerHTML = await getBadgeCierre();
    const btn = document.getElementById('btn-cierre');
    if (btn) {
      try {
        const est = await api('GET', `/periodos_cierre/estado?anio=${state.anio}&mes=${state.mes}`);
        btn.textContent = est.cerrado ? '🔓 Reabrir período' : '🔒 Cerrar período';
        btn.style.color = est.cerrado ? '#92400e' : '#166534';
      } catch {}
    }
  }, 0);

  return `
  <div class="period-bar">
    <span class="period-label">Período</span>
    <select class="period-select" onchange="changePeriod(this.value, null)">
      ${MESES.map((m, i) => `<option value="${i+1}" ${state.mes === i+1 ? 'selected' : ''}>${m}</option>`).join('')}
    </select>
    <select class="period-select" onchange="changePeriod(null, this.value)">
      ${years.map(y => `<option value="${y}" ${state.anio === y ? 'selected' : ''}>${y}</option>`).join('')}
    </select>
    <span id="cierre-badge" style="margin-left:6px"></span>
    <span style="flex:1"></span>
    <button id="btn-cierre" class="btn btn-ghost btn-sm" onclick="toggleCierrePeriodo()" style="font-size:12px">🔒 Cerrar período</button>
  </div>`;
}

async function changePeriod(mes, anio) {
  if (mes) state.mes = parseInt(mes);
  if (anio) state.anio = parseInt(anio);
  await navigate(state.page);
}

async function renderTickets() {
  const periodos = await api('GET', '/periodos_pago').catch(() => []);

  if (!state.filtroPeriodoManual && !state.filtroPeriodoPago) {
    const activo = periodos.find(p => p.estado === 'abierto');
    if (activo) state.filtroPeriodoPago = activo.id;
  }

  await loadTickets();

  const ppOpts = `
    <option value="">📚 Todo el historial</option>
    ${periodos.map(pp => `<option value="${pp.id}" ${state.filtroPeriodoPago==pp.id?'selected':''}>
      ${pp.estado==='abierto'?'🟢':'🔒'} ${String(pp.numero).padStart(3,'0')} - ${pp.nombre}
    </option>`).join('')}`;

  document.getElementById('topbar-actions').innerHTML = `
    <select class="select" style="font-size:12.5px;padding:5px 10px;min-width:200px" onchange="cambiarPeriodoTickets(this.value)">
      ${ppOpts}
    </select>
    <button class="btn btn-ghost btn-sm" onclick="openModalImportar()">📥 Importar Excel</button>
    <button class="btn btn-primary btn-sm" onclick="openModalTicket()">+ Nuevo Ticket</button>`;

  const filtered = filterTickets();

  document.getElementById('content').innerHTML = `
    <div id="presup-card-container"></div>

    ${periodBar()}

    <div class="filters" style="flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${['todos','pendiente','aprobado','debito_parcial','rechazado','pagado'].map(f => `
          <button class="filter-chip ${state.ticketFilter === f ? 'active' : ''}" onclick="setTicketFilter('${f}')">
            ${f === 'todos' ? 'Todos' : f === 'debito_parcial' ? 'Débito parcial' : f === 'pagado' ? 'Pagado' : cap(f)}
            (${f === 'todos' ? state.tickets.length : state.tickets.filter(t => t.estado === f).length})
          </button>`).join('')}
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap">
        <div style="display:flex;gap:6px;align-items:center;background:var(--ice);border-radius:8px;padding:6px 10px;flex-wrap:wrap">
          <span style="font-size:12px;color:var(--gray500);font-weight:600;white-space:nowrap">📅 Ver:</span>
          <button class="filter-chip ${state.ticketVista==='mes' && state.ticketMeses.length===0 ? 'active' : ''}" style="padding:3px 9px;font-size:11.5px" onclick="setTicketVista('mes')">${MESES[state.mes-1].slice(0,3)}</button>
          <button class="filter-chip ${state.ticketVista==='anio' ? 'active' : ''}" style="padding:3px 9px;font-size:11.5px" onclick="setTicketVista('anio')">📆 ${state.anio}</button>
          <button class="filter-chip ${state.ticketVista==='todo' ? 'active' : ''}" style="padding:3px 9px;font-size:11.5px" onclick="setTicketVista('todo')">📚 Todo</button>
          <span style="width:1px;background:var(--gray200);height:16px;margin:0 2px"></span>
          ${MESES.map((m, i) => {
            const num = i + 1;
            const active = state.ticketMeses.includes(num);
            return `<button class="filter-chip ${active ? 'active' : ''}" style="padding:3px 9px;font-size:11px;opacity:${state.ticketVista==='todo'||state.ticketVista==='anio'?'0.4':'1'}" onclick="toggleMesTicket(${num})">${m.slice(0,3)}</button>`;
          }).join('')}
        </div>
        <input class="search-input" placeholder="🔍 Buscar agente o descripción..." value="${state.ticketSearch}" style="margin:0;width:180px" oninput="state.ticketSearch=this.value;renderTicketsTable()">
      </div>
    </div>

    <div style="font-size:12px;color:var(--gray500);padding:4px 2px">
      Mostrando: <strong>${
        state.filtroPeriodoPago ? 'Período: ' + state.filtroPeriodoPagoNombre :
        state.ticketVista === 'todo' ? 'Todo el historial' :
        state.ticketVista === 'anio' ? 'Año ' + state.anio :
        state.ticketMeses.length > 0 ? state.ticketMeses.map(m => MESES[m-1]).join(', ') + ' ' + state.anio :
        MESES[state.mes-1] + ' ' + state.anio
      }</strong> — ${filterTickets().length} ticket(s)
    </div>

    <div class="card" id="tickets-card">
      <div class="card-body">
        <div id="tickets-table-body">${renderTicketsTableHTML(filtered)}</div>
      </div>
    </div>`;

  renderPresupuestoCard();
}

function filterTickets() {
  return state.tickets.filter(t => {
    const matchFilter = state.ticketFilter === 'todos' || t.estado === state.ticketFilter;
    const matchSearch = !state.ticketSearch ||
      t.agente_nombre.toLowerCase().includes(state.ticketSearch.toLowerCase()) ||
      (t.descripcion || '').toLowerCase().includes(state.ticketSearch.toLowerCase());
    return matchFilter && matchSearch;
  });
}

function setTicketFilter(f) { state.ticketFilter = f; renderTickets(); }

async function toggleMesTicket(mes) {
  if (state.ticketMeses.includes(mes)) state.ticketMeses = state.ticketMeses.filter(m => m !== mes);
  else state.ticketMeses.push(mes);
  await loadTickets();
  renderTickets();
}

async function cambiarPeriodoTickets(id) {
  state.filtroPeriodoPago = id ? parseInt(id) : null;
  state.filtroPeriodoManual = true;
  state.presupuestoPeriodoSeleccionado = state.filtroPeriodoPago;
  await loadTickets();
  renderTickets();
}

async function setDashVista(vista) { state.dashVista = vista; await loadResumen(); renderDashboard(); }
async function setTicketVista(vista) { state.ticketVista = vista; state.ticketMeses = []; await loadTickets(); renderTickets(); }

function renderTicketsTable() {
  document.getElementById('tickets-table-body').innerHTML = renderTicketsTableHTML(filterTickets());
}

function renderTicketsTableHTML(tickets) {
  if (!tickets.length) return '<div class="empty-state"><div class="emoji">🔍</div><p>Sin tickets</p><small>Ajustar filtros o agregar nuevos tickets</small></div>';
  return `<table>
    <thead>
      <tr><th>Agente</th><th>Fecha</th><th>Categoría</th><th>Período</th><th>Comprobante</th><th>Descripción</th><th>Valor</th><th>Aprobado</th><th>Estado</th><th></th></tr>
    </thead>
    <tbody>
      ${tickets.map(t => `
      <tr>
        <td class="td-name">${t.agente_nombre}</td>
        <td>${formatDate(t.fecha_gasto)}</td>
        <td><span class="badge" style="background:var(--ice2);color:var(--navy);font-size:11px">${t.categoria_nombre||'-'}</span></td>
        <td style="font-size:11px;color:var(--gray500)">${t.periodo_pago_numero ? String(t.periodo_pago_numero).padStart(3,'0')+' - '+t.periodo_pago_nombre : '—'}</td>
        <td style="font-family:'DM Mono',monospace;font-size:12px">${t.comprobante||'-'}</td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.descripcion||'-'}</td>
        <td class="td-amount">${fmt(t.valor)}</td>
        <td class="td-amount">${t.valor_aprobado != null ? fmt(t.valor_aprobado) : '-'}</td>
        <td>${estadoBadge(t.estado)}</td>
        <td>
          <div style="display:flex;gap:4px">
            ${t.estado === 'pendiente' ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="revisarTicket(${t.id},'modal')" title="Revisar">⋯</button>` : ''}
            ${(t.estado === 'aprobado' || t.estado === 'debito_parcial') ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="marcarPagado(${t.id})" title="Marcar como pagado" style="color:#0369a1">💸</button>` : ''}
            ${t.estado === 'pagado' ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="desmarcarPagado(${t.id})" title="Desmarcar pago" style="color:#64748b;font-size:11px">↩</button>` : ''}
            ${(t.estado === 'aprobado' || t.estado === 'debito_parcial' || t.estado === 'rechazado') ? `<button class="btn btn-ghost btn-sm btn-icon" onclick="revertirPendiente(${t.id})" title="Volver a Pendiente" style="color:#d97706">↺</button>` : ''}
            <button class="btn btn-ghost btn-sm btn-icon" onclick="verAdjuntosTicket(${t.id})" title="Adjuntos">📎</button>
            <button class="btn btn-ghost btn-sm btn-icon" onclick="verHistorialTicket(${t.id})" title="Historial">🕐</button>
            <button class="btn btn-ghost btn-sm btn-icon" onclick="eliminarTicket(${t.id})" title="Eliminar">🗑</button>
          </div>
        </td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

async function renderTopes() {
  await loadResumen();
  document.getElementById('content').innerHTML = `
    ${periodBar()}
    <div style="background:var(--ice);border:1px solid var(--ice2);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;font-size:13.5px;color:var(--navy)">
      💡 Podés sobreescribir el tope mensual por agente para este período sin afectar la configuración general.
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Topes — ${MESES[state.mes-1]} ${state.anio}</span></div>
      <div class="card-body">
        <table>
          <thead><tr><th>Agente</th><th>Tope General</th><th>Override Este Mes</th><th>Total Aprobado</th><th>A Transferir</th></tr></thead>
          <tbody>
            ${state.resumen.map(a => `
            <tr>
              <td class="td-name">${a.nombre}</td>
              <td class="td-amount">${fmt(a.tope_mensual)}</td>
              <td>
                <div class="tope-inline">
                  <input type="number" class="input input-money" style="width:130px;padding:5px 8px" placeholder="${a.tope_efectivo > 0 ? a.tope_efectivo : 'Sin tope'}" id="tope-${a.id}" step="100">
                  <button class="btn btn-outline btn-sm" onclick="guardarTope(${a.id})">Guardar</button>
                  ${a.tope_efectivo !== a.tope_mensual && a.tope_efectivo > 0 ? `<span style="font-size:11px;color:var(--orange);font-weight:600">Override: ${fmt(a.tope_efectivo)}</span>` : ''}
                </div>
              </td>
              <td class="td-amount">${fmt(a.total_aprobado + a.total_debito)}</td>
              <td class="td-amount" style="font-weight:700;color:var(--navy)">${fmt(a.a_transferir)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function guardarTope(agenteId) {
  const val = document.getElementById(`tope-${agenteId}`).value;
  await api('POST', '/topes', { agente_id: agenteId, anio: state.anio, mes: state.mes, tope_override: val ? parseFloat(val) : null });
  toast('Tope actualizado');
  await renderTopes();
}

async function cargarPeriodosExportar() {
  try {
    const periodos = await api('GET', '/periodos_pago');
    const sel = document.getElementById('cx-periodo-pago-id');
    if (sel) {
      sel.innerHTML = periodos.map(pp => `<option value="${pp.id}">${String(pp.numero).padStart(3,'0')} - ${pp.nombre} ${pp.estado==='abierto'?'🟢':''}</option>`).join('');
    }
  } catch(e) {}
}
